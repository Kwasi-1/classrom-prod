# Render Blueprint: one free web service in Frankfurt (next to the Neon database).
# Secrets are set in the dashboard (sync: false); `npm run github:register` writes them all to render.env,
# which can be pasted in via Environment → "Add from .env".
#
# Free plan notes:
# - Pre-deploy commands and cron jobs are paid features, so migrations run during the build and the
#   lock/reconcile jobs are called by an external scheduler (e.g. cron-job.org; see README).
# - Free services sleep after ~15 minutes idle; the same scheduler pings /api/health to keep it awake.
# To upgrade: set plan: starter. Nothing else changes.
services:
  - type: web
    name: classroom
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run db:migrate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GRADER_CALLBACK_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: APP_URL
        sync: false
