# Render Blueprint: web service + two cron jobs. Secrets are set in the dashboard (sync: false).
services:
  - type: web
    name: classroom
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GRADER_CALLBACK_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: APP_URL
        sync: false

  # Locks repos of assignments past their deadline (every 5 minutes).
  - type: cron
    name: classroom-cron-lock
    runtime: node
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: "true"
    startCommand: 'curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/lock"'
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: APP_URL
        sync: false

  # Records head commits whose push webhooks were missed (nightly, 02:00 UTC = 02:00 Accra).
  - type: cron
    name: classroom-cron-reconcile
    runtime: node
    plan: starter
    schedule: "0 2 * * *"
    buildCommand: "true"
    startCommand: 'curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reconcile"'
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: APP_URL
        sync: false
